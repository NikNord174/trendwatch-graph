[project]
name = "trendwatch-graph"
version = "0.1.0"
description = "Trend-watching knowledge graph over six months of tech news"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
